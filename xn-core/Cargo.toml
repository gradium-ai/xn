[package]
name = "xn"
version.workspace = true
edition = "2024"
description.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
license.workspace = true

[dependencies]
ash = { workspace = true, optional = true }
byteorder = { workspace = true }
cudarc = { workspace = true, optional = true }
gemm = { workspace = true }
half = { workspace = true }
kaudio = { workspace = true, optional = true }
libc = { workspace = true, optional = true }
libm = { workspace = true }
memmap2 = { workspace = true }
metal = { workspace = true, optional = true }
num-traits = { workspace = true }
num_cpus = { workspace = true }
pollster = { workspace = true, optional = true }
rand = { workspace = true, features = ["thread_rng"] }
rand_distr = { workspace = true }
rayon = { workspace = true }
safetensors = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
wgpu = { workspace = true, optional = true }
yoke = { workspace = true }

[dev-dependencies]
anyhow = { workspace = true }
paste = { workspace = true }
rand = { workspace = true }
serde_json = { workspace = true }

# Example-only dev-deps. They pull in C/socket code that doesn't build on
# `wasm32-wasip1`, so gate them to non-wasm targets — tests don't use them.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
clap = { workspace = true }
hf-hub = { workspace = true }
tokenizers = { workspace = true }
tracing-chrome = { workspace = true }

# On wasm `getrandom` has no OS entropy source and needs an explicit backend.
# Also requires `--cfg getrandom_backend="wasm_js"`, which .cargo/config.toml
# sets for the wasm target.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }

[build-dependencies]
bindgen_cuda = { workspace = true, optional = true }

[features]
default = []
accelerate = ["dep:libc"]
audio = ["dep:kaudio"]
cuda = ["dep:cudarc", "dep:bindgen_cuda"]
metal = ["dep:metal"]
vulkan = ["dep:ash"]
webgpu = ["dep:wgpu", "dep:pollster"]

[[example]]
name = "mimi"
required-features = ["audio"]

[[example]]
name = "demucs"
required-features = ["audio"]

[[example]]
name = "basic_cuda"
required-features = ["cuda"]

[[example]]
name = "basic_vulkan"
required-features = ["vulkan"]

[[example]]
name = "basic_metal"
required-features = ["metal"]

[[example]]
name = "basic_webgpu"
required-features = ["webgpu"]

[[example]]
name = "webgpu_dispatch_cost"
required-features = ["webgpu"]

[[example]]
name = "cuda_benchmarks"
required-features = ["cuda"]

[[example]]
name = "cuda_thread_test"
required-features = ["cuda"]

[[example]]
name = "webgpu_caps"
required-features = ["webgpu"]

[[example]]
name = "webgpu_gemv_lab"
required-features = ["webgpu"]

[[example]]
name = "webgpu_dtype_lab"
required-features = ["webgpu"]

[[example]]
